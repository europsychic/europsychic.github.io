<!DOCTYPE html>
<html>
<head>
  <title>Europsychic</title>

  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    div {
      position: relative;
    }

    .symbol {
      position: absolute;
      width: 500px;
      opacity: 0.10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }

    .logo {
      font-family: "UnifrakturMaguntia", serif;
      font-size: 4rem;
      position: relative;
      z-index: 1;
      margin: 0;
    }

    p {
      position: relative;
      z-index: 1;
      font-family: "Times New Roman", Times, serif;
      margin-top: 20px;
    }
  </style>

</head>

<body>

  <div>
    <img src="europsychic logo no background.png" class="symbol">

    <h1 class="logo">Europsychic</h1>

    <p>Godot?</p>
    <p>01/01/2027</p>
  </div>

</body>
</html>
